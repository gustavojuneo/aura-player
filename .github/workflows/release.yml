name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  release:
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set webOS application version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFile, writeFile } from "node:fs/promises";
            const path = "apps/web-tv/public/appinfo.json";
            const tag = process.env.RELEASE_VERSION;
            const match = /^v(\d+\.\d+\.\d+)(?:-(?:beta|rc)(?:\.\d+)?)?$/.exec(tag);
            if (!match) {
              throw new Error(`Invalid release tag: ${tag}`);
            }
            const appInfo = JSON.parse(await readFile(path, "utf8"));
            appInfo.version = match[1];
            await writeFile(path, `${JSON.stringify(appInfo, null, 2)}\n`);
          '

      - name: Package webOS application
        run: pnpm webos:package

      - name: Verify webOS package version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { access, readFile, readdir } from "node:fs/promises";
            const tag = process.env.RELEASE_VERSION;
            const match = /^v(\d+\.\d+\.\d+)(?:-(?:beta|rc)(?:\.\d+)?)?$/.exec(tag);
            if (!match) {
              throw new Error(`Invalid release tag: ${tag}`);
            }
            const version = match[1];
            const appInfo = JSON.parse(
              await readFile("apps/web-tv/dist/appinfo.json", "utf8"),
            );
            if (appInfo.version !== version) {
              throw new Error(
                `Built appinfo version ${appInfo.version} does not match ${version}`,
              );
            }

            const packages = (await readdir("apps/web-tv/release"))
              .filter((file) => file.endsWith(".ipk"));
            const expected = `com.aura.iptv_${version}_all.ipk`;
            if (packages.length !== 1 || packages[0] !== expected) {
              throw new Error(
                `Expected only ${expected}, found: ${packages.join(", ") || "none"}`,
              );
            }
            await access(`apps/web-tv/release/${expected}`);
          '

      - name: Create release archives
        run: |
          mkdir -p release-artifacts
          cp apps/web-tv/release/*.ipk release-artifacts/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=(--generate-notes --verify-tag)
          if [[ "${GITHUB_REF_NAME}" =~ -(beta|rc)(\.[0-9]+)?$ ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" release-artifacts/* "${release_flags[@]}"
